{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión</title>
    <link href="{% static 'css/theme.css' %}" rel="stylesheet">
    <script src="{% static 'js/theme.js' %}"></script>
    <style>
        .login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .login-card {
            width: 100%;
            max-width: 380px;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: var(--radius-xl);
            padding: 38px 32px 30px;
            box-shadow: var(--shadow-lg);
            transition: transform var(--dur) var(--ease), box-shadow var(--dur) var(--ease);
        }
        .login-card:hover {
            transform: translateY(-3px);
            box-shadow: var(--shadow-lg), 0 0 0 1px var(--border-strong);
        }
        .login-brand { text-align: center; margin-bottom: 26px; }
        .login-brand img { max-height: 56px; max-width: 100%; height: auto; }
        .login-brand p { margin: 14px 0 0; font-size: 13px; color: var(--text-faint); }

        .login-card .input-icon { margin-bottom: 14px; }
        .login-card .input-icon label { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

        .login-submit { margin-top: 18px; }
    </style>
</head>
<body>
    <button class="theme-toggle" onclick="toggleTheme()" style="position:absolute; top:16px; right:16px;" aria-label="Cambiar tema">
        <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.752 15.002A9.72 9.72 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"/></svg>
        <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 3v2.25M12 18.75V21M4.219 4.219l1.591 1.591M18.19 18.19l1.591 1.591M3 12h2.25M18.75 12H21M4.219 19.781l1.591-1.591M18.19 5.81l1.591-1.591"/></svg>
    </button>

    <div class="login-page">
        <div class="login-card">
            <div class="login-brand">
                {% if empresa_config.logo %}
                <img src="{{ empresa_config.logo.url }}" alt="logo">
                {% else %}
                <img src="{% static 'img/logo.png' %}" alt="logo">
                {% endif %}
                <p>Ingresá para gestionar tu facturación</p>
            </div>

            {% if form.errors %}
            <div class="alert alert-danger">Usuario o contraseña incorrectos.</div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="input-icon">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M4.5 20.25a7.5 7.5 0 0115 0"/></svg>
                    <label for="{{ form.username.id_for_label }}">Usuario</label>
                    {{ form.username }}
                </div>
                <div class="input-icon">
                    <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5.25" y="10.5" width="13.5" height="9" rx="2"/><path d="M8.25 10.5V7.5a3.75 3.75 0 017.5 0v3"/></svg>
                    <label for="{{ form.password.id_for_label }}">Contraseña</label>
                    {{ form.password }}
                </div>
                <button type="submit" class="btn btn-primary btn-block btn-lg login-submit">Ingresar</button>
            </form>
        </div>
    </div>
</body>
</html>
