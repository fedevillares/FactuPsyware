{% load static %}
<div class="app-header">
    <div class="brand">
        {% if empresa_config.logo %}
        <img src="{{ empresa_config.logo.url }}" alt="logo">
        {% else %}
        <img src="{% static 'img/logo.png' %}" alt="logo">
        {% endif %}
        <span>FactuPsyware</span>
    </div>
    <nav class="app-nav">
        <a href="{% url 'listado_facturas' %}" {% if request.path|slice:":9" == "/facturas" and request.path != "/facturas/reportes/" %}class="active"{% endif %}>Facturas</a>
        <a href="{% url 'reporte_mensual' %}" {% if request.path == "/facturas/reportes/" %}class="active"{% endif %}>Reportes</a>
        <a href="{% url 'listado_clientes' %}" {% if "/clientes" in request.path %}class="active"{% endif %}>Clientes</a>
        <a href="{% url 'listado_servicios' %}" {% if "/servicios" in request.path %}class="active"{% endif %}>Servicios</a>
        <a href="{% url 'listado_tickets' %}" {% if "/tickets" in request.path %}class="active"{% endif %}>Soporte</a>
        <a href="{% url 'kanban_leads' %}" {% if "/crm" in request.path %}class="active"{% endif %}>CRM</a>
        <a href="{% url 'panel_verificacion' %}" {% if "/arca/verificacion" in request.path %}class="active"{% endif %}>Verificación ARCA</a>
        <a href="{% url 'panel_backup' %}" {% if "/arca/backup" in request.path %}class="active"{% endif %}>Backup</a>
    </nav>
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Cambiar tema">
        <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.752 15.002A9.72 9.72 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"/></svg>
        <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4.5"/><path d="M12 3v2.25M12 18.75V21M4.219 4.219l1.591 1.591M18.19 18.19l1.591 1.591M3 12h2.25M18.75 12H21M4.219 19.781l1.591-1.591M18.19 5.81l1.591-1.591"/></svg>
    </button>
</div>
